---
# `image` can be skipped if the values are being set in your .drone.yml file
image:
  repository: 795250896452.dkr.ecr.us-east-1.amazonaws.com/docs/github-metrics
  tag: latest
  pullPolicy: Always

# global secrets are references to k8s Secrets
globalEnvSecrets:
  GITHUB_TOKEN: github-metrics-github-token
  ATLAS_CONNECTION_STRING: github-metrics-atlas-connection-string
  SLACK_WEBHOOK_URL: github-metrics-slack-webhook

# Default alerting rules for cronjob failures (pod scheduling, OOM, etc.)
# See: https://github.com/10gen/helm-charts/tree/master/charts/cronjobs#defaultalerts-configuration
defaultAlerts:
  enabled: true
  email: "cory.bullinger@mongodb.com"

cronJobs:
- name: github-metrics-collection
  # Run weekly on Mondays at 8am UTC
  # The application checks if it ran in the last 14 days and skips if so
  # Cron format: minute hour day-of-month month day-of-week
  # 0 = Sunday, 1 = Monday, etc.
  schedule: "0 8 * * 1"
  command:
  - node
  - index.js
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Run as the nodejs user (UID 1001) created in Dockerfile
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  # Last run state is now stored in MongoDB instead of a PVC
